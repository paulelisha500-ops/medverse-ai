name: Sync to Hugging Face

# Runs after CI passes on main (so only tested code is deployed), or by hand
# from the Actions tab. Mirrors main to the Hugging Face model repo, deploys
# the Space, waits for it to build and smoke-tests the live Space. See
# .github/scripts/sync_huggingface.py.
#
# Needs a repository secret HF_TOKEN: a Hugging Face token with write access
# (Settings > Secrets and variables > Actions > New repository secret).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-sync
  cancel-in-progress: false # never cut an upload off halfway

jobs:
  sync:
    name: Sync main to Hugging Face and test the live Space
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check for the HF_TOKEN secret
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="The HF_TOKEN repository secret is not set. Add a Hugging Face write token under Settings > Secrets and variables > Actions."
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg Skipping the sync."
          echo "present=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: "3.11"

      - name: Install the Hugging Face client
        if: steps.token.outputs.present == 'true'
        run: pip install "huggingface_hub>=1.0" requests

      - name: Sync, deploy and test
        if: steps.token.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SYNC_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: python .github/scripts/sync_huggingface.py
