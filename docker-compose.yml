name: medverse-ai

services:
  backend:
    build: ./backend
    ports:
      - "8004:8000"
    volumes:
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3004:80"
    depends_on:
      - backend
    restart: unless-stopped
